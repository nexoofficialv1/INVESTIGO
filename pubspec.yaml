publish_to: 'none'
version: 1.8.0-rc.16+2083
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
