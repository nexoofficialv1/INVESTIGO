  share_plus: ^10.0.2
  http: ^1.2.2
  speech_to_text: ^7.0.0
  google_mlkit_translation: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
