name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: investigo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve application version
        run: |
          APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [ -z "$APP_VERSION" ]; then
            echo "Application version not found in pubspec.yaml" >&2
            exit 1
          fi
          SAFE_VERSION="${APP_VERSION/+/-build}"
          echo "INVESTIGO_VERSION=$SAFE_VERSION" >> "$GITHUB_ENV"
          echo "Resolved INVESTIGO version: $SAFE_VERSION"

      - name: Generate Android platform files
        run: |
          flutter create . \
            --platforms=android \
            --project-name=investigo \
            --org=com.investigo

      - name: Configure Android application name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="INVESTIGO"',
              text,
              count=1,
          )
          import xml.etree.ElementTree as ET
          ET.fromstring(text)
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Configure INVESTIGO native splash
        run: |
          cat > android/app/src/main/res/drawable/investigo_splash_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#2447D8"
                  android:pathData="M48,6 L82,18 L82,43 C82,65 68,82 48,91 C28,82 14,65 14,43 L14,18 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M31,25 L58,25 L70,37 L70,70 L31,70 Z M57,27 L57,39 L68,39 Z M38,47 L63,47 L63,52 L38,52 Z M38,58 L60,58 L60,63 L38,63 Z" />
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#F6F8FC" />
              <item
                  android:drawable="@drawable/investigo_splash_icon"
                  android:gravity="center" />
          </layer-list>
          EOF

          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowSplashScreenBackground">#F6F8FC</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/investigo_splash_icon</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

      - name: Disable Android automatic data restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          def set_attr(source, name, value):
              pattern = rf'android:{name}="[^"]*"'
              if re.search(pattern, source):
                  return re.sub(
                      pattern,
                      f'android:{name}="{value}"',
                      source,
                      count=1,
                  )
              return source.replace(
                  '<application',
                  f'<application android:{name}="{value}"',
                  1,
              )

          text = set_attr(text, 'allowBackup', 'false')
          text = set_attr(text, 'fullBackupContent', 'false')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Validate release source
        run: python3 tools/validate_release.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter=expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: INVESTIGO-debug-apk-${{ env.INVESTIGO_VERSION }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: INVESTIGO-release-apk-${{ env.INVESTIGO_VERSION }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
