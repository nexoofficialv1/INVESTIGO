name: INVESTIGO Indus Production Release

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate Android platform
        run: |
          flutter create . \
            --platforms=android \
            --project-name=investigo \
            --org=com.investigo

      - name: Configure Android application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = manifest.read_text()

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="INVESTIGO"',
              s,
              count=1,
          )

          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  1,
              )

          def set_attr(text, name, value):
              pattern = rf'android:{name}="[^"]*"'
              if re.search(pattern, text):
                  return re.sub(
                      pattern,
                      f'android:{name}="{value}"',
                      text,
                      count=1,
                  )
              return text.replace(
                  '<application',
                  f'<application android:{name}="{value}"',
                  1,
              )

          s = set_attr(s, "allowBackup", "false")
          s = set_attr(s, "fullBackupContent", "false")

          manifest.write_text(s)
          PY

      - name: Restore production keystore
        shell: bash
        env:
          KS: ${{ secrets.INVESTIGO_INDUS_KEYSTORE_BASE64 }}
          SP: ${{ secrets.INVESTIGO_INDUS_STORE_PASSWORD }}
          KP: ${{ secrets.INVESTIGO_INDUS_KEY_PASSWORD }}
          KA: ${{ secrets.INVESTIGO_INDUS_KEY_ALIAS }}
        run: |
          test -n "$KS"
          test -n "$SP"
          test -n "$KP"
          test -n "$KA"

          echo "$KS" | base64 --decode \
            > android/app/investigo-indus-release.jks

          test -s android/app/investigo-indus-release.jks

          printf \
            'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=investigo-indus-release.jks\n' \
            "$SP" "$KP" "$KA" \
            > android/key.properties

      - name: Apply production Android patch
        run: python3 tools/investigo_indus_patch.py

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release source
        run: python3 tools/validate_release.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter=expanded

      - name: Verify package SDK signing
        shell: bash
        run: |
          grep -nE \
            'namespace|applicationId|minSdk|targetSdk|compileSdk' \
            android/app/build.gradle.kts

          grep -n 'signingConfig' \
            android/app/build.gradle.kts

          grep -n 'uses-permission' \
            android/app/src/main/AndroidManifest.xml || true

      - name: Build signed AAB
        run: flutter build appbundle --release --no-pub

      - name: Build signed APK
        run: flutter build apk --release --no-pub

      - name: Prepare Indus release
        shell: bash
        run: |
          mkdir -p indus

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            indus/INVESTIGO_v1.9.0_INDUS.aab

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            indus/INVESTIGO_v1.9.0_INDUS.apk

          sha256sum \
            indus/INVESTIGO_v1.9.0_INDUS.aab \
            indus/INVESTIGO_v1.9.0_INDUS.apk \
            > indus/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.9.0-indus-production"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" indus/* --clobber
          else
            gh release create \
              "$TAG" indus/* \
              --title "INVESTIGO v1.9.0 - Indus Production" \
              --notes "14-day trial with signed yearly license activation. Production release for Indus Appstore."
          fi
